<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CJR Setup — Compartilhar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;--panel:#111827;--line:#232c3d;
  --ink:#f1f5f9;--muted:#8b95a7;
  --cyan:#00E5FF;--magenta:#FF00E5;--green:#22c55e;
}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#0a0e17,#141a29);border-bottom:1px solid var(--line);padding:16px 18px}
.hwrap{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:10px}
.hwrap img{width:30px;height:30px;border-radius:8px}
.brand-cjr{font-family:'Sora',sans-serif;font-weight:800;font-size:18px}
.brand-setup{font-family:'Sora',sans-serif;font-weight:700;font-size:18px;letter-spacing:.14em;
  background:linear-gradient(90deg,var(--cyan),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
.htag{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.08em;margin-left:8px}

main{max-width:1200px;margin:0 auto;padding:20px 16px 60px;display:grid;grid-template-columns:360px 1fr;gap:22px}
@media(max-width:880px){main{grid-template-columns:1fr}}

.searchbox{position:relative;margin-bottom:14px}
#q{width:100%;padding:12px 14px 12px 38px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:var(--panel);color:var(--ink);outline:none;font-family:'Manrope',sans-serif}
#q:focus{border-color:var(--cyan)}
.sicon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.count{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 210px);overflow:auto;padding-right:4px}
.item{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit}
.item:hover{border-color:var(--cyan)}
.item.active{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.item img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px;flex:none}
.item .nm{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .pr{font-size:12px;color:var(--green);font-weight:700;margin-top:2px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:14.5px}

.fmt-toggle{display:flex;gap:8px;background:var(--bg);padding:5px;border-radius:12px;border:1px solid var(--line)}
.fmt-toggle button{flex:1;padding:9px 16px;border:none;border-radius:9px;background:transparent;color:var(--muted);font-family:'Sora',sans-serif;font-weight:700;font-size:13px;cursor:pointer}
.fmt-toggle button.on{background:linear-gradient(90deg,var(--cyan),var(--magenta));color:#04070d}

canvas{width:100%;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.5);background:#000}
canvas.sq{max-width:420px;aspect-ratio:1/1}
canvas.story{max-width:300px;aspect-ratio:9/16}

.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;max-width:440px}
.btn{flex:1;min-width:130px;display:flex;align-items:center;justify-content:center;gap:7px;padding:13px 14px;border-radius:12px;font-weight:700;font-size:14px;border:none;cursor:pointer;text-decoration:none;font-family:'Sora',sans-serif}
.btn.share{background:linear-gradient(90deg,var(--cyan),var(--magenta));color:#04070d}
.btn.dl{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.cap{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn:active{transform:scale(.98)}
.note{font-size:12px;color:var(--muted);text-align:center;max-width:440px}
.warn{font-size:12.5px;color:#fbbf24;background:#292110;border:1px solid #57450f;border-radius:10px;padding:10px 12px;max-width:440px;text-align:center;display:none}
</style>
</head>

    b.innerHTML=`<img loading="lazy" src="${img}" alt=""><div><div class="nm">${p.name}</div><div class="pr">${BRL(p.localPrice)}</div></div>`;
    b.addEventListener("click",()=>selectProduct(p,b));
    listEl.appendChild(b);
  });
  countEl.textContent=`${items.length} produto${items.length!=1?"s":""}`;
}
qEl.addEventListener("input",e=>{
  const t=e.target.value.toLowerCase().trim();
  renderList(!t?PRODUCTS:PRODUCTS.filter(p=>p.name.toLowerCase().includes(t)));
});
renderList(PRODUCTS);

function statusBadge(stock){
  if(stock<=2) return {text:`🔥 Últimas ${stock} unidade${stock>1?"s":""}`, colorA:"#ef4444", colorB:"#f97316"};
  return {text:"✅ Disponível", colorA:"#00E5FF", colorB:"#22c55e"};
}
function captionText(p){
  const de=(p.mlPrice&&p.mlPrice>p.localPrice)?`De ${BRL(p.mlPrice)} por `:"";
  return `🦉 CJR Setup\n\n${p.name}\n💰 ${de}${BRL(p.localPrice)}\n📦 Retirada ou entrega grátis em Taquarituba e região (a combinar)\n\n📲 Chama aqui: (14) 99103-8458`;
}
function waPickerLink(p){
  return `https://wa.me/?text=`+encodeURIComponent(captionText(p));
}

function selectProduct(p, btnEl){
  currentProduct=p;
  document.querySelectorAll(".item").forEach(x=>x.classList.remove("active"));
  if(btnEl) btnEl.classList.add("active");
  panel.innerHTML=`
    <div class="fmt-toggle">
      <button id="fmtSq" class="on">◻️ Quadrado</button>
      <button id="fmtStory">📱 Story</button>
    </div>
    <canvas id="cv" class="sq"></canvas>
    <div class="actions">
      <button class="btn share" id="btnShare">📤 Compartilhar</button>
      <button class="btn dl" id="btnDl">⬇️ Baixar</button>
      <button class="btn cap" id="btnCap">📋 Legenda</button>
    </div>
    <div class="warn" id="warn">Não consegui preparar a imagem pra compartilhar automaticamente (a foto vem de um site que bloqueia esse tipo de acesso). Baixei o texto — anexa a imagem manualmente, ou tira um print do cartão acima.</div>
    <div class="note" id="diag" style="font-family:monospace;font-size:10.5px;word-break:break-all"></div>
    <div class="note">Quadrado = conversa/feed · Story = Status do WhatsApp e Stories do Instagram (formato vertical)</div>
  `;
  document.getElementById("fmtSq").onclick=()=>setFormat("sq");
  document.getElementById("fmtStory").onclick=()=>setFormat("story");
  document.getElementById("btnCap").addEventListener("click",async ()=>{
    try{ await navigator.clipboard.writeText(captionText(p)); flash(document.getElementById("btnCap"),"Copiado!"); }
    catch(e){ alert(captionText(p)); }
  });
  document.getElementById("btnDl").addEventListener("click",()=>downloadCanvas(p));
  document.getElementById("btnShare").addEventListener("click",()=>shareCanvas(p));
  setFormat("sq");
}
function flash(el,msg){
  const old=el.textContent; el.textContent=msg;
  setTimeout(()=>el.textContent=old,1400);
}

function setFormat(fmt){
  currentFormat=fmt;
  document.getElementById("fmtSq").classList.toggle("on", fmt==="sq");
  document.getElementById("fmtStory").classList.toggle("on", fmt==="story");
  const cv=document.getElementById("cv");
  cv.className = fmt==="sq" ? "sq" : "story";
  drawCard(currentProduct, fmt);
}

async function ensureFonts(){
  try{
    await Promise.all([
      document.fonts.load("800 40px Sora"),
      document.fonts.load("700 40px Sora"),
      document.fonts.load("700 24px Manrope"),
      document.fonts.load("600 24px Manrope"),
    ]);
  }catch(e){}
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawContain(ctx,img,x,y,w,h){
  const s=Math.min(w/img.width,h/img.height);
  const iw=img.width*s, ih=img.height*s;
  ctx.drawImage(img, x+(w-iw)/2, y+(h-ih)/2, iw, ih);
}
function wrapText(ctx,text,x,y,maxW,lineH,maxLines){
  const words=text.split(" ");
  let line="", lines=[];
  for(const w of words){
    const test=line?line+" "+w:w;
    if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=w; }
    else line=test;
  }
  if(line) lines.push(line);
  lines=lines.slice(0,maxLines);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineH));
  return lines.length;
}

async function drawCard(p, fmt){
  if(!p) return;
  await ensureFonts();
  const cv=document.getElementById("cv");
  const W = fmt==="sq" ? 1080 : 1080;
  const H = fmt==="sq" ? 1080 : 1920;
  cv.width=W; cv.height=H;
  const ctx=cv.getContext("2d");

  // fundo
  ctx.fillStyle="#0a0e17"; ctx.fillRect(0,0,W,H);
  // brilho ambiente nos cantos (cores da marca)
  let g=ctx.createRadialGradient(W*0.08,H*0.06,0,W*0.08,H*0.06,W*0.55);
  g.addColorStop(0,"rgba(255,0,229,.20)"); g.addColorStop(1,"rgba(255,0,229,0)");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  g=ctx.createRadialGradient(W*0.95,H*0.95,0,W*0.95,H*0.95,W*0.6);
  g.addColorStop(0,"rgba(0,229,255,.18)"); g.addColorStop(1,"rgba(0,229,255,0)");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  const pad = 56;
  let y = 0;

  // marca
  ctx.textBaseline="alphabetic";
  try{ ctx.drawImage(ICON_IMG, pad, 46, 46, 46); }catch(e){}
  ctx.font="800 34px Sora, sans-serif"; ctx.fillStyle="#ffffff";
  ctx.fillText("CJR", pad+58, 78);
  const cjrW=ctx.measureText("CJR").width;
  const wg=ctx.createLinearGradient(pad+58+cjrW+10,0,pad+58+cjrW+170,0);
  wg.addColorStop(0,"#00E5FF"); wg.addColorStop(1,"#FF00E5");
  ctx.fillStyle=wg; ctx.font="700 30px Sora, sans-serif";
  ctx.fillText("SETUP", pad+58+cjrW+10, 76);
  y = 130;

  // foto emoldurada em gradiente
  const frameW = W - pad*2;
  const frameH = fmt==="sq" ? 560 : 780;
  const bgrad = ctx.createLinearGradient(pad,y,pad+frameW,y+frameH);
  bgrad.addColorStop(0,"#00E5FF"); bgrad.addColorStop(.5,"#8B5CF6"); bgrad.addColorStop(1,"#FF00E5");
  roundRect(ctx,pad,y,frameW,frameH,30); ctx.fillStyle=bgrad; ctx.fill();
  roundRect(ctx,pad+4,y+4,frameW-8,frameH-8,26); ctx.fillStyle="#f4f5f7"; ctx.fill();

  const img=new Image();
  const t0 = performance.now();
  let loadErrorDetail = "";
  let tainted = false;
  const src=(p.imgs&&p.imgs[0])||"";
  const tryLoad = (useCors) => new Promise(resolve=>{
    if(!src){ resolve(null); return; }
    const im=new Image();
    if(useCors) im.crossOrigin="anonymous";
    im.onload=()=>resolve(im);
    im.onerror=()=>resolve(null);
    im.src=src;
  });
  let loadedImg = await tryLoad(true);
  if(!loadedImg && src){
    loadedImg = await tryLoad(false);
    tainted = !!loadedImg; // carregou, mas sem CORS -> mancha o canvas (exportar/compartilhar não vai funcionar)
  }
  if(!src) loadErrorDetail = "produto sem foto cadastrada";
  else if(!loadedImg) loadErrorDetail = "erro ao carregar (rede bloqueada ou site fora do ar)";
  const imgLoaded = !!loadedImg;
  if(imgLoaded) drawContain(ctx,loadedImg,pad+40,y+40,frameW-80,frameH-80);

  // badge de estoque
  const st=statusBadge(p.stock);
  ctx.font="700 26px Sora, sans-serif";
  const padX=20, badgeH=50, badgeW=ctx.measureText(st.text).width+padX*2;
  const bx=pad+frameW-badgeW-18, by=y+18;
  const bgB=ctx.createLinearGradient(bx,0,bx+badgeW,0);
  bgB.addColorStop(0,st.colorA); bgB.addColorStop(1,st.colorB);
  roundRect(ctx,bx,by,badgeW,badgeH,badgeH/2); ctx.fillStyle=bgB; ctx.fill();
  ctx.fillStyle="#04140f"; ctx.textBaseline="middle";
  ctx.fillText(st.text, bx+padX, by+badgeH/2+1);
  ctx.textBaseline="alphabetic";

  y = y + frameH + 64;

  // nome
  ctx.fillStyle="#f8fafc";
  ctx.font="700 44px Sora, sans-serif";
  const nameLines = wrapText(ctx, p.name, pad, y, frameW, 52, 2);
  y += nameLines*52 + 30;

  // de / por
  const temDe = p.mlPrice && p.mlPrice > p.localPrice;
  ctx.font="600 30px Manrope, sans-serif";
  if(temDe){
    ctx.fillStyle="#8b95a7";
    const deTxt=BRL(p.mlPrice);
    ctx.fillText(deTxt, pad, y);
    const dw=ctx.measureText(deTxt).width;
    ctx.strokeStyle="#8b95a7"; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(pad,y-11); ctx.lineTo(pad+dw,y-11); ctx.stroke();
    ctx.fillStyle="#4b5563"; ctx.font="600 30px Manrope, sans-serif";
    ctx.fillText("→", pad+dw+18, y);
  }
  y += 62;

  ctx.font="800 66px Sora, sans-serif";
  const priceTxt=BRL(p.localPrice);
  const pg=ctx.createLinearGradient(pad,0,pad+ctx.measureText(priceTxt).width,0);
  pg.addColorStop(0,"#22ffe0"); pg.addColorStop(1,"#22c55e");
  ctx.fillStyle=pg;
  ctx.fillText(priceTxt, pad, y);
  y += 54;

  // linha divisora
  const divGrad=ctx.createLinearGradient(pad,0,W-pad,0);
  divGrad.addColorStop(0,"rgba(255,255,255,0)"); divGrad.addColorStop(.5,"rgba(255,255,255,.16)"); divGrad.addColorStop(1,"rgba(255,255,255,0)");
  ctx.strokeStyle=divGrad; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-pad,y); ctx.stroke();
  y += 44;

  // entrega
  ctx.font="600 28px Manrope, sans-serif"; ctx.fillStyle="#aab2c0";
  const entregaLines = wrapText(ctx, "📦 Retirada ou entrega grátis em Taquarituba e região (a combinar)", pad, y, frameW, 38, 2);
  y += entregaLines*38 + 34;

  // botão CTA
  const ctaH=88;
  const ctaGrad=ctx.createLinearGradient(pad,0,W-pad,0);
  ctaGrad.addColorStop(0,"#00E5FF"); ctaGrad.addColorStop(1,"#FF00E5");
  roundRect(ctx,pad,y,frameW,ctaH,20); ctx.fillStyle=ctaGrad; ctx.fill();
  ctx.font="800 32px Sora, sans-serif"; ctx.fillStyle="#04070d";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("📲 Chamar no WhatsApp", W/2, y+ctaH/2+2);
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";

  document.getElementById("warn").style.display = (imgLoaded && !tainted) ? "none" : "block";
  currentTainted = tainted || !imgLoaded;
  const diag = document.getElementById("diag");
  if(diag){
    if(imgLoaded && !tainted){
      diag.textContent = `✅ foto carregada com CORS (${((performance.now()-t0)|0)}ms) · pode baixar/compartilhar a imagem · ícone: ${ICON_IMG.complete && ICON_IMG.naturalWidth>0 ? "ok" : "não carregou"}`;
    } else if(imgLoaded && tainted){
      diag.textContent = `⚠️ foto carregada, mas SEM CORS — dá pra ver o cartão, mas baixar/compartilhar a imagem vai falhar (o site da foto não libera). url: ${src}`;
    } else {
      diag.textContent = `⚠️ foto NÃO carregou — ${loadErrorDetail} · url: ${src||"(nenhuma)"} · ícone: ${ICON_IMG.complete && ICON_IMG.naturalWidth>0 ? "ok (então não é bloqueio geral de rede)" : "também não carregou (bloqueio geral do navegador)"}`;
    }
  }
}

const ICON_IMG = new Image();
ICON_IMG.src = ICON;

async function canvasToBlob(){
  const cv=document.getElementById("cv");
  return await new Promise(resolve=>{
    try{ cv.toBlob(b=>resolve(b), "image/png"); }
    catch(e){ resolve(null); }
  });
}

function downloadCanvas(p){
  const cv=document.getElementById("cv");
  try{
    const url=cv.toDataURL("image/png");
    const a=document.createElement("a");
    a.href=url; a.download=`CJR_${(p.sku||p.name).replace(/[^a-zA-Z0-9]+/g,"_")}_${currentFormat}.png`;
    a.click();
  }catch(e){
    document.getElementById("warn").style.display="block";
  }
}

async function shareCanvas(p){
  const blob = await canvasToBlob();
  const txt = captionText(p);
  if(blob){
    try{
      const file=new File([blob], "cjr_produto.png", {type:"image/png"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], text:txt, title:"CJR Setup"});
        return;
      }
    }catch(e){ /* usuário cancelou ou navegador recusou -> tenta próximo nível */ }
  }
  // sem suporte a compartilhar arquivo: tenta compartilhar só o texto nativamente
  try{
    if(navigator.share){
      await navigator.share({text:txt, title:"CJR Setup"});
      return;
    }
  }catch(e){}
  // último recurso: abre o seletor de contato/grupo do WhatsApp só com o texto
  const a=document.createElement("a");
  a.href=waPickerLink(p); a.target="_blank"; a.rel="noopener";
  document.body.appendChild(a); a.click(); a.remove();
  document.getElementById("warn").style.display="block";
}
</script>
