<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0b0e14; --ink-soft:#4b5266; --muted:#8a90a3; --line:#e7e9ef;
  --bg:#f7f8fa; --card:#ffffff;
  --cyan:#00e5ff; --magenta:#ff00e5;
  --price:#0f9d58; --price-bg:#eafaf1;
  --wa:#25d366; --wa-ink:#04310f;
  --radius:16px; --radius-sm:10px;
  --shadow-card:0 1px 2px rgba(15,23,42,.04), 0 1px 1px rgba(15,23,42,.03);
  --shadow-hover:0 16px 32px -12px rgba(15,23,42,.18);
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.4}
.font-display{font-family:'Space Grotesk',sans-serif}

/* ===== Header ===== */
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#0b0e14 0%,#151b2c 55%,#1b2340 100%);color:#fff;padding:18px 20px 16px}
.hwrap{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex-shrink:0}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-name{font-family:'Space Grotesk';font-size:20px;font-weight:700;letter-spacing:-.2px}
.brand-name b{font-weight:700}
.brand-tag{font-size:11.5px;color:#9aa3bf;font-weight:500;margin-top:1px}
.hspacer{flex:1}
.hstats{display:flex;gap:18px;margin-right:4px}
.hstat{display:flex;flex-direction:column;align-items:flex-end}
.hstat b{font-family:'Space Grotesk';font-size:16px;font-weight:600;color:#fff}
.hstat span{font-size:10px;color:#8890ab;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.wabtn{display:inline-flex;align-items:center;gap:8px;background:var(--wa);color:var(--wa-ink);font-weight:700;padding:10px 18px;border-radius:999px;text-decoration:none;font-size:14px;white-space:nowrap;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 10px rgba(37,211,102,.3)}
.wabtn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(37,211,102,.4)}
.wabtn:active{transform:scale(.97)}

/* ===== Filtros ===== */
.searchbar{position:sticky;top:70px;z-index:25;background:var(--bg);padding:14px 20px 10px;border-bottom:1px solid var(--line)}
.searchwrap{max-width:1240px;margin:0 auto}
.searchrow{position:relative;margin-bottom:10px}
#q{width:100%;padding:13px 16px 13px 42px;border:1.5px solid var(--line);border-radius:12px;font-size:14.5px;background:#fff;outline:none;font-family:'Inter';transition:border-color .15s,box-shadow .15s}
#q:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,229,255,.1)}
.sicon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.chiprow{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;transition:all .15s;font-family:'Inter'}
.chip:hover{border-color:#c7cbd8}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.count{max-width:1240px;margin:10px auto 0;font-size:12.5px;color:var(--muted);font-weight:500}

/* ===== Grid ===== */
main{max-width:1240px;margin:0 auto;padding:18px 20px 70px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-card);transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.imgbox{position:relative;width:100%;aspect-ratio:1/1;background:#fbfbfc;cursor:zoom-in;overflow:hidden}
.imgbox img{width:100%;height:100%;object-fit:contain;padding:12px;transition:transform .25s}
.imgbox:hover img{transform:scale(1.05)}
.imgbox.placeholder{display:flex;align-items:center;justify-content:center;cursor:default}
.imgbox.placeholder svg{width:64px;height:64px;opacity:.16}
.ph-label{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.badge{position:absolute;top:10px;left:10px;background:rgba(11,14,20,.85);color:#fff;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;backdrop-filter:blur(4px)}
.gcount{position:absolute;bottom:10px;right:10px;background:rgba(11,14,20,.7);color:#fff;font-size:10.5px;padding:3px 8px;border-radius:999px;font-weight:600}
.body{padding:13px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.eyebrow{font-family:'Space Grotesk';font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.name{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em;color:var(--ink)}
.desc{font-size:12px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pricerow{display:flex;align-items:baseline;gap:7px;margin-top:2px}
.price{font-family:'Space Grotesk';font-size:20px;font-weight:700;color:var(--price)}
.pricelbl{font-size:10.5px;color:var(--muted);font-weight:600}
.buy{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--wa);color:var(--wa-ink);font-weight:700;text-decoration:none;padding:11px;border-radius:11px;font-size:13.5px;transition:filter .15s}
.buy:hover{filter:brightness(1.05)}
.buy:active{transform:scale(.98)}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty svg{width:56px;height:56px;opacity:.2;margin-bottom:14px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 16px;border-top:1px solid var(--line);margin-top:20px}
footer b{color:var(--ink-soft)}

/* ===== Lightbox ===== */
.lb{position:fixed;inset:0;background:rgba(8,10,16,.95);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column}
.lb.on{display:flex}
.lb img{max-width:92vw;max-height:76vh;object-fit:contain;border-radius:10px}
.lbtitle{color:#fff;font-size:14px;margin-top:16px;text-align:center;padding:0 16px;max-width:90vw;font-weight:500}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);font-size:30px;color:#fff;background:rgba(255,255,255,.1);border:none;width:50px;height:50px;border-radius:50%;cursor:pointer;transition:background .15s}
.lbnav:hover{background:rgba(255,255,255,.18)}
#lbprev{left:16px}#lbnext{right:16px}
#lbclose{position:absolute;top:16px;right:20px;font-size:28px;color:#fff;background:none;border:none;cursor:pointer;width:44px;height:44px;border-radius:50%;transition:background .15s}
#lbclose:hover{background:rgba(255,255,255,.1)}
.lbdots{color:#9aa3bf;font-size:12px;margin-top:8px;font-weight:500}

@media(max-width:640px){
  .hstats{display:none}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .name{font-size:12.5px}
  .price{font-size:16.5px}
  .buy{padding:9px;font-size:12px}
  .searchbar{top:64px}
  header{padding:14px 16px 12px}
  main{padding:14px 12px 60px}
}
</style>

-superframe-isengard-magic-240mm-bomba-infinit-display-lcd-customizavel-argb-intel-amd-controladora-white-magic-240mm-wh_192523.jpg"], "desc": "Water cooler SuperFrame Isengard Magic 240mm ARGB branco, display LCD, Intel/AMD", "categoria": "REFRIGERACAO - WATER"}, {"sku": "XIAOMI-REDMI-6-64GB-GOLD", "name": "Xiaomi Redmi 6 64GB Gold", "stock": 1, "mlPrice": 343.9, "localPrice": 349.9, "imgs": ["fotos/XIAOMI-REDMI-6-64GB-GOLD-1.jpg", "fotos/XIAOMI-REDMI-6-64GB-GOLD-2.jpg", "fotos/XIAOMI-REDMI-6-64GB-GOLD-3.jpg"], "desc": "Xiaomi Redmi 6 64GB Gold", "categoria": "CELULARES"}];
} catch (e) {
  console.error('Falha ao carregar dados do catálogo:', e);
  PRODUCTS = [];
}

const BRL = n => (Number(n) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const waLink = (name, price) => `https://wa.me/${WA}?text=` + encodeURIComponent(`Olá! Tenho interesse neste produto do catálogo:\n\n*${name}*\nPreço local: ${BRL(price)}\n\nEstá disponível?`);

document.getElementById("waTop").href = `https://wa.me/${WA}?text=` + encodeURIComponent("Olá! Vi o catálogo da CJR Setup e quero mais informações.");
document.getElementById("statTotal").textContent = PRODUCTS.length;

const grid = document.getElementById("grid");
const countEl = document.getElementById("count");
const emptyEl = document.getElementById("emptyEl");

// ===== Categorias (chips) =====
const categoriasUnicas = [...new Set(PRODUCTS.map(p => p.categoria).filter(Boolean))];
let categoriaAtiva = null;

function montarChips() {
  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  const todos = document.createElement('button');
  todos.className = 'chip' + (categoriaAtiva === null ? ' active' : '');
  todos.textContent = 'Todos';
  todos.onclick = () => { categoriaAtiva = null; montarChips(); render(); };
  chips.appendChild(todos);

  categoriasUnicas.sort().forEach(cat => {
    const b = document.createElement('button');
    b.className = 'chip' + (categoriaAtiva === cat ? ' active' : '');
    b.textContent = cat;
    b.onclick = () => { categoriaAtiva = cat; montarChips(); render(); };
    chips.appendChild(b);
  });
}

// ===== Criação de card — CADA card é isolado. Se um produto tiver dado
// inválido, ele é pulado (com aviso no console) SEM travar os outros.
// (esse isolamento é o que evita o bug de "alguns produtos somem sem motivo") =====
function criarCard(p, idx, listaAtual) {
  try {
    const nome = String(p.name || 'Produto sem nome');
    const preco = Number(p.localPrice) || 0;
    const imgs = Array.isArray(p.imgs) ? p.imgs.filter(Boolean) : [];
    const temFoto = imgs.length > 0 && !String(imgs[0]).includes('placeholder');

    const card = document.createElement('div');
    card.className = 'card';

    // --- imagem ---
    const imgbox = document.createElement('div');
    imgbox.className = 'imgbox' + (temFoto ? '' : ' placeholder');

    if (p.stock > 1) {
      const b = document.createElement('span');
      b.className = 'badge';
      b.textContent = `${p.stock} disponíveis`;
      imgbox.appendChild(b);
    }

    if (temFoto) {
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = imgs[0];
      img.alt = nome;
      imgbox.appendChild(img);
      if (imgs.length > 1) {
        const gc = document.createElement('span');
        gc.className = 'gcount';
        gc.textContent = `📷 ${imgs.length}`;
        imgbox.appendChild(gc);
      }
      imgbox.onclick = () => openLB(p);
    } else {
      imgbox.innerHTML = OWL_MARK;
      const lbl = document.createElement('div');
      lbl.className = 'ph-label';
      lbl.textContent = 'Foto em breve';
      imgbox.appendChild(lbl);
    }
    card.appendChild(imgbox);

    // --- corpo ---
    const body = document.createElement('div');
    body.className = 'body';

    if (p.categoria) {
      const eyebrow = document.createElement('div');
      eyebrow.className = 'eyebrow';
      eyebrow.textContent = p.categoria;
      body.appendChild(eyebrow);
    }

    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = nome;
    body.appendChild(nameEl);

    if (p.desc) {
      const descEl = document.createElement('div');
      descEl.className = 'desc';
      descEl.textContent = p.desc;
      body.appendChild(descEl);
    }

    const pricerow = document.createElement('div');
    pricerow.className = 'pricerow';
    const priceEl = document.createElement('span');
    priceEl.className = 'price';
    priceEl.textContent = BRL(preco);
    const pricelbl = document.createElement('span');
    pricelbl.className = 'pricelbl';
    pricelbl.textContent = 'à vista/local';
    pricerow.appendChild(priceEl);
    pricerow.appendChild(pricelbl);
    body.appendChild(pricerow);

    const buy = document.createElement('a');
    buy.className = 'buy';
    buy.target = '_blank';
    buy.rel = 'noopener';
    buy.href = waLink(nome, preco);
    buy.textContent = '💬 Comprar no WhatsApp';
    body.appendChild(buy);

    card.appendChild(body);
    return card;
  } catch (err) {
    console.error(`Produto no índice ${idx} não pôde ser renderizado:`, p, err);
    return null;
  }
}

function render() {
  const termo = (document.getElementById('q').value || '').toLowerCase().trim();

  let lista = PRODUCTS;
  if (categoriaAtiva) {
    lista = lista.filter(p => p.categoria === categoriaAtiva);
  }
  if (termo) {
    lista = lista.filter(p => {
      const alvo = ((p.name || '') + ' ' + (p.desc || '') + ' ' + (p.categoria || '')).toLowerCase();
      return alvo.includes(termo);
    });
  }

  grid.innerHTML = '';
  let renderizados = 0;
  lista.forEach((p, i) => {
    const card = criarCard(p, i, lista);
    if (card) {
      grid.appendChild(card);
      renderizados++;
    }
  });

  countEl.textContent = `${renderizados} produto${renderizados !== 1 ? 's' : ''}`;
  emptyEl.style.display = renderizados === 0 ? 'flex' : 'none';
  grid.style.display = renderizados === 0 ? 'none' : 'grid';
}

// ===== Lightbox =====
let lbImgs = [], lbI = 0, lbName = '';
const lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg'),
      lbtitle = document.getElementById('lbtitle'), lbdots = document.getElementById('lbdots');

function openLB(p) {
  lbImgs = (p.imgs || []).filter(i => i && !String(i).includes('placeholder'));
  lbI = 0; lbName = p.name || '';
  if (!lbImgs.length) return;
  lb.classList.add('on');
  showLB();
}
function showLB() {
  lbimg.src = lbImgs[lbI];
  lbtitle.textContent = lbName;
  lbdots.textContent = lbImgs.length > 1 ? `${lbI + 1} / ${lbImgs.length}` : '';
}
document.getElementById('lbprev').onclick = e => { e.stopPropagation(); lbI = (lbI - 1 + lbImgs.length) % lbImgs.length; showLB(); };
document.getElementById('lbnext').onclick = e => { e.stopPropagation(); lbI = (lbI + 1) % lbImgs.length; showLB(); };
document.getElementById('lbclose').onclick = () => lb.classList.remove('on');
lb.addEventListener('click', e => { if (e.target === lb) lb.classList.remove('on'); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') lb.classList.remove('on');
  if (e.key === 'ArrowLeft') document.getElementById('lbprev').click();
  if (e.key === 'ArrowRight') document.getElementById('lbnext').click();
});

document.getElementById('q').addEventListener('input', render);

montarChips();
render();
</script>
