: "Teclado mecânico Ajazz NK68 65% QWERTY, RGB, cabo removível, branco"}, {"sku": "VENTILADOR-TETO-VENTI-DELTA-3", "name": "Ventilador de Teto Venti-Delta New Delta 95cm 3 Pás", "stock": 1, "mlPrice": 220, "localPrice": 209.0, "imgs": ["https://http2.mlstatic.com/D_861845-MLA95398410596_102025-F.jpg", "https://http2.mlstatic.com/D_891613-MLA113395601280_072026-F.jpg", "https://http2.mlstatic.com/D_751079-MLA113395601598_072026-F.jpg"], "desc": "Ventilador de teto Venti-Delta New Delta 95cm, 3 pás MDF, com luz, 220V"}, {"sku": "VOLANTE-THRUSTMASTER-FERRARI-4", "name": "Volante Thrustmaster Ferrari 458 Spider (Xbox)", "stock": 1, "mlPrice": 1832.45, "localPrice": 1740.9, "imgs": ["https://http2.mlstatic.com/D_674204-MLU70821205827_082023-F.jpg", "https://http2.mlstatic.com/D_960049-MLM40672004959_022020-F.jpg", "https://http2.mlstatic.com/D_634191-MLU70820912401_082023-F.jpg", "https://http2.mlstatic.com/D_721640-MLU70820911933_082023-F.jpg", "https://http2.mlstatic.com/D_939259-MLU70820911935_082023-F.jpg"], "desc": "Volante gamer Thrustmaster Ferrari 458 Spider com pedais, Xbox/PC"}, {"sku": "WATER-COOLER-CM-MASTERLIQUID-2", "name": "Water Cooler Cooler Master MasterLiquid ML240L V2 RGB", "stock": 1, "mlPrice": 469.9, "localPrice": 446.9, "imgs": ["https://http2.mlstatic.com/D_648144-MLU74380100034_022024-F.jpg", "https://http2.mlstatic.com/D_734491-MLU74380179112_022024-F.jpg", "https://http2.mlstatic.com/D_787731-MLU74380100048_022024-F.jpg", "https://http2.mlstatic.com/D_778085-MLU74379981758_022024-F.jpg", "https://http2.mlstatic.com/D_952524-MLU74499770791_022024-F.jpg", "https://http2.mlstatic.com/D_718162-MLU74499770795_022024-F.jpg"], "desc": "Water cooler Cooler Master MasterLiquid ML240L V2 RGB 240mm, com pasta térmica"}, {"sku": "WATER-COOLER-REDRAGON-LE240-AR", "name": "Water Cooler Redragon LE240 ARGB", "stock": 3, "mlPrice": 464.16, "localPrice": 440.9, "imgs": ["https://http2.mlstatic.com/D_617779-MLB109043705353_032026-F.jpg", "https://http2.mlstatic.com/D_883955-MLB109044085473_032026-F.jpg", "https://http2.mlstatic.com/D_863461-MLB108255105106_032026-F.jpg", "https://http2.mlstatic.com/D_979104-MLB108255194974_032026-F.jpg", "https://http2.mlstatic.com/D_656529-MLB109044115427_032026-F.jpg", "https://http2.mlstatic.com/D_670511-MLB108255135050_032026-F.jpg", "https://http2.mlstatic.com/D_846607-MLB109042483395_032026-F.jpg"], "desc": "Water cooler Redragon LE240 ARGB 240mm, cooler líquido AIO, com pasta térmica"}, {"sku": "WATER-COOLER-SUPERFRAME-MAGIC", "name": "Water Cooler SuperFrame Isengard Magic 240 ARGB", "stock": 1, "mlPrice": 432.9, "localPrice": 419.9, "imgs": ["https://img.terabyteshop.com.br/produto/m/water-cooler-superframe-isengard-magic-240mm-bomba-infinit-display-lcd-customizavel-argb-intel-amd-controladora-black-magic-240mm-bk_192551.jpg"], "desc": "Water cooler SuperFrame Isengard Magic 240mm ARGB, display LCD, Intel/AMD"}];
const BRL=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const waLink=(name,price)=>`https://wa.me/${WA}?text=`+encodeURIComponent(`Olá! Tenho interesse neste produto do catálogo:\n\n*${name}*\nPreço local: ${BRL(price)}\n\nEstá disponível?`);
document.getElementById("waTop").href=`https://wa.me/${WA}?text=`+encodeURIComponent("Olá! Vi o catálogo da CJR Setup e quero mais informações.");
const grid=document.getElementById("grid"), countEl=document.getElementById("count");
function render(list){
  grid.innerHTML="";
  list.forEach((p,idx)=>{
    const img=(p.imgs&&p.imgs[0])||"";
    const gc=(p.imgs&&p.imgs.length>1)?`<span class="gcount">📷 ${p.imgs.length}</span>`:"";
    const el=document.createElement("div");el.className="card";
    el.innerHTML=`
      <div class="imgbox" data-i="${idx}">
        ${p.stock>1?`<span class="badge">${p.stock} em estoque</span>`:""}
        <img loading="lazy" src="${img}" alt="${p.name.replace(/"/g,'&quot;')}">
        ${gc}
      </div>
      <div class="body">
        <div class="name">${p.name}</div>
        <div class="desc">${p.desc||""}</div>
        <div class="pricerow"><span class="price">${BRL(p.localPrice)}</span><span class="pricelbl">à vista/local</span></div>
        <a class="buy" target="_blank" rel="noopener" href="${waLink(p.name,p.localPrice)}">💬 Comprar no WhatsApp</a>
      </div>`;
    grid.appendChild(el);
  });
  countEl.textContent=`${list.length} produto${list.length!=1?"s":""}`;
  grid.querySelectorAll(".imgbox").forEach(b=>b.addEventListener("click",()=>openLB(list[+b.dataset.i])));
}
// busca
let cur=PRODUCTS;
document.getElementById("q").addEventListener("input",e=>{
  const t=e.target.value.toLowerCase().trim();
  cur=!t?PRODUCTS:PRODUCTS.filter(p=>(p.name+" "+(p.desc||"")).toLowerCase().includes(t));
  render(cur);
});
// lightbox
let lbImgs=[],lbI=0,lbName="";
const lb=document.getElementById("lb"),lbimg=document.getElementById("lbimg"),lbtitle=document.getElementById("lbtitle"),lbdots=document.getElementById("lbdots");
function openLB(p){lbImgs=p.imgs||[];lbI=0;lbName=p.name;if(!lbImgs.length)return;lb.classList.add("on");showLB();}
function showLB(){lbimg.src=lbImgs[lbI];lbtitle.textContent=lbName;lbdots.textContent=lbImgs.length>1?`${lbI+1} / ${lbImgs.length}`:"";}
document.getElementById("lbprev").onclick=e=>{e.stopPropagation();lbI=(lbI-1+lbImgs.length)%lbImgs.length;showLB();};
document.getElementById("lbnext").onclick=e=>{e.stopPropagation();lbI=(lbI+1)%lbImgs.length;showLB();};
document.getElementById("lbclose").onclick=()=>lb.classList.remove("on");
lb.addEventListener("click",e=>{if(e.target===lb)lb.classList.remove("on");});
document.addEventListener("keydown",e=>{if(!lb.classList.contains("on"))return;if(e.key==="Escape")lb.classList.remove("on");if(e.key==="ArrowLeft")document.getElementById("lbprev").click();if(e.key==="ArrowRight")document.getElementById("lbnext").click();});
render(PRODUCTS);
</script>
