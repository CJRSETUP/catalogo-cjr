<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CJR Setup — Catálogo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1420;--card:#fff;--ink:#0f1724;--muted:#6b7280;--line:#e5e7eb;--brand:#2563eb;--price:#16a34a;--wa:#22c55e;--wa2:#16a34a}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f3f4f6;color:var(--ink);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#111827,#1f2937);color:#fff;padding:14px 18px;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.hwrap{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logoimg{width:44px;height:44px;border-radius:12px;object-fit:cover;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.brand{font-size:22px;font-weight:800;letter-spacing:.3px}
.brand span{color:#60a5fa}
.tag{font-size:12.5px;color:#cbd5e1}
.hspacer{flex:1}
.wabtn{display:inline-flex;align-items:center;gap:7px;background:var(--wa);color:#04310f;font-weight:700;padding:9px 14px;border-radius:999px;text-decoration:none;font-size:14px}
.wabtn:active{transform:scale(.97)}
.searchbar{position:sticky;top:72px;z-index:15;background:#f3f4f6;padding:12px 18px 6px;border-bottom:1px solid var(--line)}
.searchwrap{max-width:1200px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:relative}
.sbox{position:relative;flex:1;min-width:220px}
#q{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#fff;outline:none}
#q:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.sicon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
#catf{padding:12px 34px 12px 14px;border:1px solid var(--line);border-radius:12px;font-size:14.5px;background:#fff;outline:none;color:var(--ink);appearance:none;-webkit-appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="%236b7280"><path d="M5.5 7.5L10 12l4.5-4.5"/></svg>');background-repeat:no-repeat;background-position:right 10px center;background-size:16px}
.count{max-width:1200px;margin:8px auto 0;font-size:13px;color:var(--muted)}
main{max-width:1200px;margin:0 auto;padding:16px 14px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(15,23,36,.12)}
.imgbox{position:relative;width:100%;aspect-ratio:1/1;background:#fff;cursor:zoom-in;overflow:hidden}
.imgbox img{width:100%;height:100%;object-fit:contain;padding:10px;transition:transform .2s}
.imgbox:hover img{transform:scale(1.04)}
.badge{position:absolute;top:10px;left:10px;background:rgba(17,24,39,.82);color:#fff;font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px}
.fotoprop{position:absolute;top:10px;right:10px;background:rgba(22,163,74,.92);color:#fff;font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:999px}
.gcount{position:absolute;bottom:10px;right:10px;background:rgba(17,24,39,.72);color:#fff;font-size:11px;padding:3px 8px;border-radius:999px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.catlabel{font-size:10.5px;color:var(--brand);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.name{font-size:15px;font-weight:650;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.desc{font-size:12.8px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pricerow{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.price{font-size:22px;font-weight:800;color:var(--price)}
.pricelbl{font-size:11px;color:var(--muted);font-weight:600}
.buy{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--wa);color:#04310f;font-weight:700;text-decoration:none;padding:11px;border-radius:12px;font-size:14.5px}
.buy:active{transform:scale(.98)}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:26px 16px}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(8,12,20,.94);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column}
.lb.on{display:flex}
.lb img{max-width:94vw;max-height:78vh;object-fit:contain;border-radius:8px}
.lbtitle{color:#fff;font-size:14px;margin-top:14px;text-align:center;padding:0 16px;max-width:90vw}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;color:#fff;background:rgba(255,255,255,.12);border:none;width:52px;height:52px;border-radius:50%;cursor:pointer}
#lbprev{left:14px}#lbnext{right:14px}
#lbclose{position:absolute;top:14px;right:18px;font-size:30px;color:#fff;background:none;border:none;cursor:pointer}
.lbdots{color:#9ca3af;font-size:12px;margin-top:8px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:11px}.name{font-size:13.5px}.price{font-size:19px}.buy{padding:9px;font-size:13px}.searchbar{top:64px}.searchwrap{flex-wrap:wrap}#catf{flex:1;min-width:140px}}
</style>
</head>

const grid=document.getElementById("grid"), countEl=document.getElementById("count");
function render(list){
  grid.innerHTML="";

        <div class="catlabel">${p.category||""}</div>
        <div class="name">${p.name}</div>
        <div class="desc">${p.desc||""}</div>
        <div class="pricerow"><span class="price">${BRL(p.localPrice)}</span><span class="pricelbl">à vista/local</span></div>
        <a class="buy" target="_blank" rel="noopener" href="${waLink(p.name,p.localPrice)}">💬 Comprar no WhatsApp</a>
      </div>`;
    grid.appendChild(el);
  });
  countEl.textContent=`${list.length} produto${list.length!=1?"s":""}`;
  grid.querySelectorAll(".imgbox").forEach(b=>b.addEventListener("click",()=>openLB(list[+b.dataset.i])));
}
let cur=PRODUCTS;
function aplicaFiltros(){
  const t=document.getElementById("q").value.toLowerCase().trim();
  const cat=catSel.value;
  cur=PRODUCTS.filter(p=>{
    const okTexto=!t||(p.name+" "+(p.desc||"")).toLowerCase().includes(t);
    const okCat=!cat||p.category===cat;
    return okTexto&&okCat;
  });
  render(cur);
}
document.getElementById("q").addEventListener("input",aplicaFiltros);
catSel.addEventListener("change",aplicaFiltros);
// lightbox
let lbImgs=[],lbI=0,lbName="";
const lb=document.getElementById("lb"),lbimg=document.getElementById("lbimg"),lbtitle=document.getElementById("lbtitle"),lbdots=document.getElementById("lbdots");
function openLB(p){lbImgs=p.imgs||[];lbI=0;lbName=p.name;if(!lbImgs.length)return;lb.classList.add("on");showLB();}
function showLB(){lbimg.src=lbImgs[lbI];lbtitle.textContent=lbName;lbdots.textContent=lbImgs.length>1?`${lbI+1} / ${lbImgs.length}`:"";}
document.getElementById("lbprev").onclick=e=>{e.stopPropagation();lbI=(lbI-1+lbImgs.length)%lbImgs.length;showLB();};
document.getElementById("lbnext").onclick=e=>{e.stopPropagation();lbI=(lbI+1)%lbImgs.length;showLB();};
document.getElementById("lbclose").onclick=()=>lb.classList.remove("on");
lb.addEventListener("click",e=>{if(e.target===lb)lb.classList.remove("on");});
document.addEventListener("keydown",e=>{if(!lb.classList.contains("on"))return;if(e.key==="Escape")lb.classList.remove("on");if(e.key==="ArrowLeft")document.getElementById("lbprev").click();if(e.key==="ArrowRight")document.getElementById("lbnext").click();});
render(PRODUCTS);
</script>
</body>
</html>
